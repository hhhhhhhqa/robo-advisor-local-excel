name: Local Excel checks
on: [push, pull_request, workflow_dispatch]
jobs:
  local-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap on macOS
        if: runner.os == 'macOS'
        run: bash scripts/launch.sh setup
      - name: Bootstrap on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/launch.ps1 setup
      - name: Tests on macOS
        if: runner.os == 'macOS'
        run: |
          .tools/uv pip install --python .venv/bin/python '.[test]'
          .venv/bin/python -m pytest -q
      - name: Tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .tools/uv.exe pip install --python .venv/Scripts/python.exe '.[test]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pytest -q
