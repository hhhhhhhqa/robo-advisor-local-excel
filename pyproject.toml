[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-advisor-local-excel"
version = "1.1.0"
description = "Local Excel portfolio with automatic offline calculations and manual market updates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "pyarrow>=17,<24",
  "openpyxl>=3.1,<4",
  "yfinance>=0.2.54,<2",
  "requests>=2.32,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "oletools>=0.60,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
